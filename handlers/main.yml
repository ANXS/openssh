---
# systemd_service state=reloaded starts an inactive unit. Keep this strict:
# a caller asking for reload must never create a competing listener.
- name: Reload ssh  # noqa command-instead-of-module
  ansible.builtin.command:
    cmd: "systemctl reload ssh.service"
  changed_when: true

# Port, ListenAddress and AddressFamily are read only at startup.
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
